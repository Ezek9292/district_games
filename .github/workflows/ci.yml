name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded PR runs are cancelled; runs on main finish so a deploy is never cut off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          DIRECT_URL: postgresql://user:pass@localhost:5432/db
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid

  # Pushes to main that pass both builds are deployed to the server over SSH (see DEPLOY.md).
  deploy:
    name: Deploy to server
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      APP_DIR: ${{ secrets.APP_DIR }}
    steps:
      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY APP_DIR; do
            [ -n "${!v}" ] || { echo "::error::Repository secret $v is not set (see DEPLOY.md)"; exit 1; }
          done
          # Pasted secrets often carry a trailing space or line break, which breaks the login.
          # Trim them once and use the DEPLOY_* copies from here on.
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          DEPLOY_HOST="$(trim "$SSH_HOST")"; DEPLOY_USER="$(trim "$SSH_USER")"
          DEPLOY_PORT="$(trim "$SSH_PORT")"; DEPLOY_DIR="$(trim "$APP_DIR")"
          { echo "DEPLOY_HOST=$DEPLOY_HOST"; echo "DEPLOY_USER=$DEPLOY_USER"; echo "DEPLOY_PORT=$DEPLOY_PORT"; echo "DEPLOY_DIR=$DEPLOY_DIR"; } >> "$GITHUB_ENV"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Strip Windows line endings and make sure the key ends with a newline.
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || { echo "::error::SSH_PRIVATE_KEY is not a valid private key"; exit 1; }
          # Public facts only, so a wrong key or user is easy to spot in the log.
          echo "Loaded key: $(ssh-keygen -lf ~/.ssh/deploy_key)"
          # GitHub hides secret values in the log, so compare instead of printing.
          [ "$SSH_USER" = "$DEPLOY_USER" ] || echo "::notice::SSH_USER had spaces or line breaks around it; they were removed"
          [ "$DEPLOY_USER" = deploy ] || echo "::warning::SSH_USER is not 'deploy'; the server only lets GitHub Actions in as deploy"
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Pull, build and restart
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e; cd '$DEPLOY_DIR'; git fetch origin main; git checkout -q main; git merge --ff-only origin/main; bash deploy.sh"

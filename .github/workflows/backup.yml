name: Database backup

# Nightly dump of the app's tables, encrypted and kept as a workflow artifact for 30 days.
# The repo is public, so the dump is always encrypted before upload. Restore steps: DEPLOY.md.
on:
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC daily
  workflow_dispatch:

jobs:
  backup:
    name: Dump and encrypt
    runs-on: ubuntu-latest
    steps:
      - name: Install pg_dump 17 (matches Supabase)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump and encrypt
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          for v in BACKUP_DATABASE_URL BACKUP_PASSPHRASE; do
            [ -n "${!v}" ] || { echo "::error::Repository secret $v is not set (see DEPLOY.md)"; exit 1; }
          done
          file="church-games-$(date -u +%Y-%m-%d).dump"
          /usr/lib/postgresql/17/bin/pg_dump "$BACKUP_DATABASE_URL" \
            --schema=public --no-owner --no-privileges --format=custom --file="$file"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 --output "$file.gpg" "$file"
          rm "$file"
          ls -lh "$file.gpg"
          echo "BACKUP_FILE=$file.gpg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error

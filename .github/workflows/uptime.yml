name: Uptime check

# Checks the live site and API. A failed run makes GitHub email you (Settings → Notifications → Actions).
# Scheduled runs can start a few minutes late; for instant alerts also add UptimeRobot (see DEPLOY.md).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

env:
  SITE_URL: https://districtgames.edonkor.dev
  API_URL: https://districtgames-api.edonkor.dev

jobs:
  check:
    name: Site and API respond
    runs-on: ubuntu-latest
    steps:
      - name: Frontend
        run: curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 10 --max-time 20 -o /dev/null "$SITE_URL/"
      - name: API and database
        run: curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 10 --max-time 20 "$API_URL/health"
